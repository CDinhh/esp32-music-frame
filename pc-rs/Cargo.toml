[package]
name = "musicframe"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "MusicFrame"
path = "src/main.rs"

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp"] }
memmap2 = "0.9.12"
native-tls = "0.2.18"
regex-lite = "0.1.9"
roxmltree = "0.21.2"
serde_json = "1.0.154"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip"] }
windows = { version = "0.62.2", features = ["Media_Control", "Storage_Streams", "Foundation", "Foundation_Collections", "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Storage_Xps", "Win32_Graphics_Dwm", "Win32_UI_HiDpi"] }

[profile.release]
lto = true
strip = true
panic = "abort"
codegen-units = 1

[profile.dev]
opt-level = 2
