[env]
platform = espressif32
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_txtfiles = src/index.html
monitor_speed = 115200
build_flags = -DBOARD_HAS_PSRAM
lib_deps =
  lovyan03/LovyanGFX@^1.2.7
  bitbank2/AnimatedGIF@^2.1.1
  bblanchon/ArduinoJson@^7.2.1
extra_scripts = post:merge_bin.py

; real board
[env:esp32s3]
; logs on the native USB port (the one the board is plugged into)
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; Wokwi: same firmware, ILI9341 stand-in (Wokwi has no ST7789 part).
; `pio test -e wokwi` runs Unity tests inside the simulator (needs WOKWI_CLI_TOKEN).
[env:wokwi]
build_flags = ${env.build_flags} -DSIM_WOKWI
; never flash a real board from the sim env
upload_protocol = custom
upload_command = echo sim build, nothing to upload
test_testing_command =
  ../.tools/wokwi-cli.exe
  --timeout
  30000
  --expect-text
  Ignored
  .

; Wiring check for the real board: flash this first, it tests the TFT wires then draws colour bars.
[env:wiretest]
build_src_filter = -<*> +<display.cpp> +<../wiretest/>
build_flags = ${env.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1
test_ignore = *

; same wiring check in Wokwi
[env:wiretest-sim]
build_src_filter = -<*> +<display.cpp> +<../wiretest/>
build_flags = ${env.build_flags} -DSIM_WOKWI
upload_protocol = custom
upload_command = echo sim build, nothing to upload
test_ignore = *
